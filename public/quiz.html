<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>แบบทดสอบ - Magic Home</title>
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/quiz.css" />
</head>
<body class="quiz-page">

  <!-- forest silhouette, fixed along the bottom, same family as the homepage/register trees -->
  <div class="quiz-forest" aria-hidden="true">
    <svg class="quiz-forest-layer quiz-forest-back" viewBox="0 0 800 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <g class="q-tree" style="--sway-delay:0s"><path d="M40 220 L40 150 M40 160 Q10 150 15 120 Q25 130 40 120 M40 145 Q65 138 62 112 Q50 122 40 112 M40 130 Q15 122 20 98 Q30 106 40 98" stroke="#1a3324" stroke-width="6" fill="none" stroke-linecap="round"/></g>
      <g class="q-tree" style="--sway-delay:0.6s"><path d="M180 220 L180 130 M180 145 Q145 135 152 102 Q164 114 180 102 M180 125 Q210 116 205 86 Q192 98 180 86" stroke="#193020" stroke-width="7" fill="none" stroke-linecap="round"/></g>
      <g class="q-tree" style="--sway-delay:1.2s"><path d="M620 220 L620 140 M620 155 Q585 145 592 112 Q604 124 620 112 M620 135 Q650 126 645 96 Q632 108 620 96" stroke="#1a3324" stroke-width="6" fill="none" stroke-linecap="round"/></g>
      <g class="q-tree" style="--sway-delay:0.3s"><path d="M760 220 L760 150 M760 163 Q725 153 732 120 Q744 132 760 120 M760 143 Q790 134 785 104 Q772 116 760 104" stroke="#193020" stroke-width="7" fill="none" stroke-linecap="round"/></g>
    </svg>
    <svg class="quiz-forest-layer quiz-forest-front" viewBox="0 0 800 260" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <g class="q-tree" style="--sway-delay:0.2s"><path d="M-10 260 L-10 160 M-10 178 Q-45 166 -38 130 Q-25 143 -10 130 M-10 156 Q22 146 16 110 Q2 124 -10 110" stroke="#0f2418" stroke-width="9" fill="none" stroke-linecap="round"/></g>
      <g class="q-tree" style="--sway-delay:0.8s"><path d="M810 260 L810 150 M810 170 Q845 158 838 120 Q825 133 810 120 M810 146 Q778 136 784 98 Q798 112 810 98" stroke="#0f2418" stroke-width="10" fill="none" stroke-linecap="round"/></g>
      <g class="q-tree" style="--sway-delay:1.4s"><path d="M400 260 L400 175 M400 190 Q365 180 372 148 Q384 160 400 148 M400 172 Q430 164 425 134 Q412 146 400 134" stroke="#102818" stroke-width="8" fill="none" stroke-linecap="round"/></g>
    </svg>
  </div>

  <!-- scattered twinkling stars, same sparkle language as the homepage title -->
  <div class="quiz-stars" aria-hidden="true">
    <span class="q-star" style="top:6%;  left:8%;  font-size:0.8rem;  animation-delay:0s;"></span>
    <span class="q-star" style="top:12%; left:22%; font-size:0.55rem; animation-delay:0.6s;"></span>
    <span class="q-star" style="top:5%;  left:38%; font-size:0.7rem;  animation-delay:1.2s;"></span>
    <span class="q-star" style="top:15%; left:52%; font-size:0.6rem;  animation-delay:1.8s;"></span>
    <span class="q-star" style="top:7%;  left:68%; font-size:0.85rem; animation-delay:0.3s;"></span>
    <span class="q-star" style="top:13%; left:82%; font-size:0.6rem;  animation-delay:2.1s;"></span>
    <span class="q-star" style="top:4%;  left:92%; font-size:0.7rem;  animation-delay:1.5s;"></span>
    <span class="q-star" style="top:22%; left:4%;  font-size:0.5rem;  animation-delay:0.9s;"></span>
    <span class="q-star" style="top:26%; left:94%; font-size:0.55rem; animation-delay:2.4s;"></span>
    <span class="q-star" style="top:18%; left:60%; font-size:0.5rem;  animation-delay:1.1s;"></span>
  </div>

  <!-- small drifting fireflies, echoing the hero -->
  <div class="quiz-fireflies" aria-hidden="true">
    <span class="q-firefly" style="left:12%; bottom:30%; animation-delay:0s;"></span>
    <span class="q-firefly" style="left:78%; bottom:38%; animation-delay:1.4s;"></span>
    <span class="q-firefly" style="left:50%; bottom:24%; animation-delay:2.6s;"></span>
    <span class="q-firefly" style="left:88%; bottom:20%; animation-delay:0.8s;"></span>
    <span class="q-firefly" style="left:22%; bottom:18%; animation-delay:3.2s;"></span>
  </div>

  <div class="container quiz-wrap">
    <div class="progress-track" id="progressTrack"></div>

    <div class="quiz-error" id="quizError"></div>

    <div class="question-card" id="questionCard">
      <!-- คำถามจะถูกสร้างด้วย JS -->
    </div>

    <div class="quiz-nav" id="quizNav">
      <button type="button" class="nav-btn-secondary" id="prevBtn">ย้อนกลับ</button>
      <button type="button" class="pill-btn" id="nextBtn">ถัดไป</button>
    </div>
  </div>

  <script src="/js/quiz.js"></script>
</body>
</html>
